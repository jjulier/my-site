  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      background: #F4F1EA;
      color: #1C1A17;
    }
    a { color: inherit; text-decoration: none; }

    /* A poster. Everything inside is sized in --u, which scales with the poster. */
    .poster {
      container-type: size;
      position: relative;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
    }
    .poster-inner {
      --u: min(1cqi, 0.72cqb);
      position: absolute;
      inset: 0;
      padding: calc(9 * var(--u));
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: var(--font);
    }
    .quote {
      max-width: calc(84 * var(--u));
      font-size: calc(var(--size) * var(--u));
      line-height: 1.22;
      letter-spacing: -0.005em;
      font-style: var(--style);
      hyphens: manual;
    }
    .quote p { margin: 0; text-wrap: pretty; }
    .quote p + p { margin-top: 0.6em; }
    .quote.short p { text-wrap: balance; }
    .quote.full { color: color-mix(in srgb, var(--ink) 42%, var(--bg)); }
    .quote.full mark { background: none; color: var(--ink); }

    /* Wall */
    .wall-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 24px;
      padding: 24px 24px 0;
    }
    .wall-head nav a { margin-right: 20px; color: #0000FF; }
    .wall-head nav a:hover { background: #FBE4EC; }
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin: 48px 24px 32px;
    }
    h1 em { font-weight: 400; }
    .wall {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      padding: 0 24px 64px;
    }
    .wall .poster {
      aspect-ratio: 1 / 1.33;
      cursor: pointer;
      transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s;
    }
    .wall .poster:hover, .wall .poster:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 14px 30px -14px rgba(0,0,0,.45);
      outline: none;
    }
    .wall .meta { display: none; }

    /* Single poster, filling the screen */
    .single { display: none; }
    body.is-single { overflow: hidden; }
    body.is-single .single { display: block; position: fixed; inset: 0; }
    body.is-single .wall-view { display: none; }
    .single .poster { position: absolute; inset: 0; }
    .single .poster-inner { --u: min(1cqi, 0.62cqb); align-items: flex-start; padding-left: max(calc(9 * var(--u)), calc(50cqi - 46 * var(--u))); }
    .meta {
      position: absolute;
      left: 24px;
      bottom: 22px;
      right: 280px;
      font-family: 'Playfair Display', serif;
      font-style: normal;
      line-height: 1.4;
    }
    .meta a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .meta .author { opacity: .7; }
    .controls {
      position: fixed;
      right: 24px;
      bottom: 22px;
      display: flex;
      gap: 20px;
      color: var(--ink);
      z-index: 2;
    }
    .controls > * { white-space: nowrap; }
    .controls a, .controls button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }
    .controls a:hover, .controls button:hover { text-decoration: underline; text-underline-offset: 3px; }
    .controls .count { opacity: .7; font-variant-numeric: tabular-nums; }
    .single.fresh .poster { animation: fade .5s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 640px) {
      .wall-head, .wall { padding-left: 16px; padding-right: 16px; }
      h1 { margin-left: 16px; margin-right: 16px; }
      .wall { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .single .poster-inner { --u: min(1cqi, 0.6cqb); padding: 12cqi 8cqi 30cqi; }
      .meta { left: 16px; right: 16px; bottom: 64px; }
      .controls { left: 16px; right: 16px; bottom: 22px; gap: 16px; justify-content: flex-start; }
      .controls .count { display: none; }
      .controls a { margin-left: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      .single .poster { animation: none; }
      .wall .poster { transition: none; }
    }

  <script>
    const { posters, styles } = {"posters":[{"quote":"In short, I went on the classic journey from “design is what the user sees” to “design is a reliable process for identifying and solving problems, then clearly communicating that process to others.”","marked":"In short, \u0001I went on the classic journey from “design is what the user sees” to “design is a reliable process for identifying and solving problems\u0002, then clearly communicating that process to others.”","excerpt":"I went on the classic journey from “design is what the user sees” to “design is a reliable process for identifying and solving problems","title":"Leaving Elicit","url":"https://maggieappleton.com/leaving-elicit","author":"","style":0},{"quote":"Working with these tools is like swimming in a pond where the ground drops off sharply. One minute you’re wading comfortably and there’s support under your feet. Then suddenly you cross a specific line, and you’re back to swimming on your own. This analogy is my best way to explain what it feels like when the model goes from helpful to clueless. Right now it’s easy for a human being to find that line if you’re doing advanced research, so you know where the intelligence drops off. But the line is moving. You can feel it slowly drifting outwards under your feet.","marked":"\u0001Working with these tools is like swimming in a pond where the ground drops off sharply.\u0002 One minute you’re wading comfortably and there’s support under your feet. Then suddenly you cross a specific line, and you’re back to swimming on your own. This analogy is my best way to explain what it feels like when the model goes from helpful to clueless. Right now it’s easy for a human being to find that line if you’re doing advanced research, so you know where the intelligence drops off. But the line is moving. You can feel it slowly drifting outwards under your feet.","excerpt":"Working with these tools is like swimming in a pond where the ground drops off sharply.","title":"Some thoughts about Anthropic’s new cryptanalysis results – A Few Thoughts on Cryptographic Engineering","url":"https://blog.cryptographyengineering.com/2026/07/29/some-notes-about-anthropics-new-results/","author":"","style":1},{"quote":"The core of it still stands. A GP practice is a small business. Most partners aren’t salaried — we own the business, and what we take home is whatever is left at the end. Profit = income minus expenses.","marked":"The core of it still stands. \u0001A GP practice is a small business. Most partners aren’t salaried — we own the business, and what we take home is whatever is left at the end.\u0002 Profit = income minus expenses.","excerpt":"A GP practice is a small business. Most partners aren’t salaried — we own the business, and what we take home is whatever is left at the end.","title":"How GPs are paid: the 2026 update — Dr Neil Paul","url":"https://www.drneilpaul.blog/how-gps-are-paid-2026/","author":"Dr Neil Paul","style":2},{"quote":"rather than requiring a full discovery in advance as a rule, perhaps we let teams decide if and when discovery is required. Or whether, instead, the most productive thing is to gain consensus on what we think we know about the user and get cracking exploring ways that might best meet their needs","marked":"\u0001rather than requiring a full discovery in advance as a rule, perhaps we let teams decide if and when discovery is required\u0002. Or whether, instead, the most productive thing is to gain consensus on what we think we know about the user and get cracking exploring ways that might best meet their needs","excerpt":"rather than requiring a full discovery in advance as a rule, perhaps we let teams decide if and when discovery is required","title":"(1) Re-shaping (public sector) user centred design for an AI assisted world","url":"https://leisareichelt.substack.com/p/re-shaping-public-sector-user-centred?triedRedirect=true","author":"Leisa Reichelt","style":3},{"quote":"For decades, product development has been defined by scarcity. Agile, Scrum, and Kanban are in essence systems for allocating limited engineering capacity. Ruthless prioritization was the core skill. Deploy your company’s most expensive resource — engineering time — against the initiatives most likely to have impact.\n\nBut what happens when AI can transform product specifications into working code in minutes? The classic “effort vs. impact” quadrant analysis is a vertical line. Everything is “low effort, variable impact.”","marked":"\u0001For decades, product development has been defined by scarcity\u0002. Agile, Scrum, and Kanban are in essence systems for allocating limited engineering capacity. Ruthless prioritization was the core skill. Deploy your company’s most expensive resource — engineering time — against the initiatives most likely to have impact.\n\nBut what happens when AI can transform product specifications into working code in minutes? The classic “effort vs. impact” quadrant analysis is a vertical line. Everything is “low effort, variable impact.”","excerpt":"For decades, product development has been defined by scarcity","title":"When Implementation is Free. What happens when AI drives the… | by Joe McLean | Medium","url":"https://medium.com/@islandlife/when-implementation-is-free-14ced3554f9c","author":"Joe McLean","style":4},{"quote":"There is a body of research on what cognitive scientists call “extended mind theory” — the idea that human cognition is not confined to the brain but extends into the tools and artefacts we use. Writing is perhaps the oldest and most profound of these cognitive tools. When we write clinical notes in our own voice, we are not transcribing our thoughts after the fact: we are completing them.","marked":"There is a body of research on what cognitive scientists call “extended mind theory” — the idea that human cognition is not confined to the brain but extends into the tools and artefacts we use. Writing is perhaps the oldest and most profound of these cognitive tools. \u0001When we write clinical notes in our own voice, we are not transcribing our thoughts after the fact: we are completing them.\u0002","excerpt":"When we write clinical notes in our own voice, we are not transcribing our thoughts after the fact: we are completing them.","title":"I Was an Enthusiastic Early Adopter of AI Scribes. Here’s Why I Stopped","url":"https://benngooch.substack.com/p/i-was-an-enthusiastic-early-adopter?r=318dr5&utm_medium=ios&triedRedirect=true","author":"Dr Benn Gooch","style":5},{"quote":"You can't build Place People Go as a feature. It's a thing that happened over time, through a specific and unrepeatable sequence of events, most of which were not planned and some of which were just luck.","marked":"\u0001You can't build Place People Go as a feature.\u0002 It's a thing that happened over time, through a specific and unrepeatable sequence of events, most of which were not planned and some of which were just luck.","excerpt":"You can't build Place People Go as a feature.","title":"The Hacker News tarpit","url":"https://www.joanwestenberg.com/the-hacker-news-tarpit/","author":"JA Westenberg","style":6},{"quote":"Creating software now feels like cooking.\n\nIf you want a meal for yourself, you can do that without needing a professional chef. The results might not compare to a top restaurant, but that’s not the point.\n\nYour home-cooked software is exactly what you need, without extra fuss or cost. And each time you build something personal, you gain a deeper appreciation for the craft of creating software.\n\nDoes that mean frontend development or design is dead? No, not at all.\n\nThe more that build software, the more who will appreciate using great software. Cooking at home makes you appreciate going out to eat.","marked":"\u0001Creating software now feels like cooking.\u0002\n\nIf you want a meal for yourself, you can do that without needing a professional chef. The results might not compare to a top restaurant, but that’s not the point.\n\nYour home-cooked software is exactly what you need, without extra fuss or cost. And each time you build something personal, you gain a deeper appreciation for the craft of creating software.\n\nDoes that mean frontend development or design is dead? No, not at all.\n\nThe more that build software, the more who will appreciate using great software. Cooking at home makes you appreciate going out to eat.","excerpt":"Creating software now feels like cooking.","title":"Personal Software","url":"https://leerob.com/personal-software","author":"Lee Robinson","style":7},{"quote":"We believe that the winners in such spaces must and will become full stack AI companies. And we’ve already seen this just last week with Cursor making the first such move, with Fin being the second. As features become ~free to build, the technology factors that will differentiate the players will be the AI under the hood, and if you’re using the same general purpose off-the-shelf model as everyone else, you have no durable differentiation.","marked":"We believe that the winners in such spaces must and will become full stack AI companies. And we’ve already seen this just last week with Cursor making the first such move, with Fin being the second. As features become ~free to build, the technology factors that will differentiate the players will be the AI under the hood, and \u0001if you’re using the same general purpose off-the-shelf model as everyone else, you have no durable differentiation\u0002.","excerpt":"if you’re using the same general purpose off-the-shelf model as everyone else, you have no durable differentiation","title":"The age of vertical models is here","url":"https://www.linkedin.com/pulse/age-vertical-models-here-eoghan-mccabe-nsy6c/","author":"Eoghan McCabe","style":8},{"quote":"The researcher who can walk into a planning conversation and say this problem is not worth solving because users do not actually have it, and here is the evidence, is providing something the organization cannot generate from its own velocity. No agent produces that. No dashboard surfaces it. No amount of iteration discovers it, because iteration optimizes within a frame. Knowing whether the frame is right in the first place is the work. That is the version of the job that survives. Not because it is the version researchers prefer. Because it is the version nobody else can do.","marked":"The researcher who can walk into a planning conversation and say this problem is not worth solving because users do not actually have it, and here is the evidence, is providing something the organization cannot generate from its own velocity. No agent produces that. No dashboard surfaces it. No amount of iteration discovers it, because iteration optimizes within a frame. \u0001Knowing whether the frame is right in the first place is the work\u0002. That is the version of the job that survives. Not because it is the version researchers prefer. Because it is the version nobody else can do.","excerpt":"Knowing whether the frame is right in the first place is the work","title":"The Dev Orgs Are Restructuring Around AI. What Does This Mean for UXR?","url":"https://www.thevoiceofuser.com/the-dev-orgs-are-restructuring-around-ai-what-does-this-mean-for-uxr/","author":"Constantine Papas","style":9},{"quote":"Second, tasks were sometimes framed around site features rather than underlying goals. For example:\n\nYou have saved some locations as favourites and want to access them now. How would you do that?\n\nFeature-led tasks reduce friction in testing and make it harder to detect whether the design meaningfully supports the task. Neither of these choices are outrageous. Both are common.\n\nBut both bias results toward reassurance rather than discovery.","marked":"Second, tasks were sometimes framed around site features rather than underlying goals. For example:\n\nYou have saved some locations as favourites and want to access them now. How would you do that?\n\n\u0001Feature-led tasks reduce friction in testing and make it harder to detect whether the design meaningfully supports the task\u0002. Neither of these choices are outrageous. Both are common.\n\nBut both bias results toward reassurance rather than discovery.","excerpt":"Feature-led tasks reduce friction in testing and make it harder to detect whether the design meaningfully supports the task","title":"What went wrong with the BoM Redesign?","url":"https://leisareichelt.substack.com/p/what-went-wrong-with-the-bom-redesign","author":"Leisa Reichelt","style":10},{"quote":"The Gell-Mann amnesia effect is a cognitive bias describing the tendency of individuals to critically assess media reports in a domain they are knowledgeable about, yet continue to trust reporting in other areas despite recognizing similar potential inaccuracies.","marked":"The Gell-Mann amnesia effect is \u0001a cognitive bias describing the tendency of individuals to critically assess media reports in a domain they are knowledgeable about, yet continue to trust reporting in other areas\u0002 despite recognizing similar potential inaccuracies.","excerpt":"a cognitive bias describing the tendency of individuals to critically assess media reports in a domain they are knowledgeable about, yet continue to trust reporting in other areas","title":"People are not friction","url":"https://daverupert.com/2026/03/people-are-not-friction/?utm_campaign=ux-works-through-social-relationships-ai-tools-are-erasing-them&utm_medium=referral&utm_source=productpicnic.beehiiv.com","author":"Dave Rupert","style":11},{"quote":"If you tell a friend they can now instantly create any app, they’ll probably say “Cool! Now I need to think of an idea.” Then they will forget about it, and never build a thing. The problem is not that your friend is horribly uncreative. It’s that most people’s problems are not software-shaped, and most won’t notice even when they are.","marked":"If you tell a friend they can now instantly create any app, they’ll probably say “Cool! Now I need to think of an idea.” Then they will forget about it, and never build a thing. The problem is not that your friend is horribly uncreative. It’s that \u0001most people’s problems are not software-shaped, and most won’t notice even when they are.\u0002","excerpt":"most people’s problems are not software-shaped, and most won’t notice even when they are.","title":"My Claude Code Psychosis","url":"https://jasmi.news/p/claude-code?utm_source=substack&utm_medium=email&hide_intro_popup=true","author":"Jasmine Sun","style":0},{"quote":"We’re still in the dorks-only phase of model-assisted programming, but I can imagine soon-to-arrive interfaces where you just drag and drop components while narrating your desires with your voice, the models able to perform the “brainstorming,” “planning,” and “work” — operations that can take ten minutes or longer today — in mere seconds tomorrow. There will be a fluidity to software in the future. Version numbers will be pointless. We’ll all have our own versions. Claude Code be our partner in production. As you imagine new features, Claude produces them. Why would we lock ourselves into someone else’s proprietary binary?","marked":"We’re still in the dorks-only phase of model-assisted programming, but I can imagine soon-to-arrive interfaces where you just drag and drop components while narrating your desires with your voice, the models able to perform the “brainstorming,” “planning,” and “work” — operations that can take ten minutes or longer today — in mere seconds tomorrow. \u0001There will be a fluidity to software in the future. Version numbers will be pointless. We’ll all have our own versions.\u0002 Claude Code be our partner in production. As you imagine new features, Claude produces them. Why would we lock ourselves into someone else’s proprietary binary?","excerpt":"There will be a fluidity to software in the future. Version numbers will be pointless. We’ll all have our own versions.","title":"Software Bonkers","url":"https://craigmod.com/essays/software_bonkers/","author":"Craig Mod","style":1},{"quote":"Taste gets talked about as though it were the highest creative faculty: the one thing the machines will never be able to take from us. The one thing, no less, we’ll need if we want to have a job in a few years.","marked":"\u0001Taste gets talked about as though it were the highest creative faculty\u0002: the one thing the machines will never be able to take from us. The one thing, no less, we’ll need if we want to have a job in a few years.","excerpt":"Taste gets talked about as though it were the highest creative faculty","title":"What inspired you?","url":"https://designlobster.substack.com/p/169-what-inspired-you","author":"Ben Strak","style":2},{"quote":"Sometimes user needs unintentionally frame users as ‘request makers’ who are making demands of the service. The ‘7 lenses’ framework shifts the conversation away from what users are asking the service to do, and towards how they are actually experiencing it.","marked":"\u0001Sometimes user needs unintentionally frame users as ‘request makers’ who are making demands of the service.\u0002 The ‘7 lenses’ framework shifts the conversation away from what users are asking the service to do, and towards how they are actually experiencing it.","excerpt":"Sometimes user needs unintentionally frame users as ‘request makers’ who are making demands of the service.","title":"Understanding user experience in lung cancer screening beyond user needs - NHS","url":"https://design-history.prevention-services.nhs.uk/lung-health-check/2026/03/beyond-user-needs/","author":"Mike Watson","style":3},{"quote":"The concerns I express are about how the Ministry of Defence dealt with these procurements. In respect of Palantir, their land-and-expand approach is nothing other than what any rational if cynical economic agent would do when faced with the lucrative opportunities presented to it by Ministry of Defence. They appear to have done what they could get away with and perfectly lawfully.","marked":"The concerns I express are about how the Ministry of Defence dealt with these procurements. In respect of Palantir, their land-and-expand approach is nothing other than what any rational if cynical economic agent would do when faced with the lucrative opportunities presented to it by Ministry of Defence. \u0001They appear to have done what they could get away with and perfectly lawfully.\u0002","excerpt":"They appear to have done what they could get away with and perfectly lawfully.","title":"Land and Expand – how Palantir captured the Ministry of Defence","url":"https://davidallengreen.com/2026/02/land-and-expand-how-palantir-captured-the-ministry-of-defence/","author":"Dave Allen Green","style":4},{"quote":"A user research report isn't just a record of what you learned — it's a tool for driving action","marked":"\u0001A user research report isn't just a record of what you learned — it's a tool for driving action\u0002","excerpt":"A user research report isn't just a record of what you learned — it's a tool for driving action","title":"How to Write a Good User Research Report","url":"https://medium.com/@benweedonresearch/how-to-write-a-good-user-research-report-7a82d0a96968","author":"Ben Weedon","style":5},{"quote":"The distinction between strategies and tactics reveals a critical blind spot: health systems are designed around strategies, while the majority of patient decision-making happens tactically. Misinformation often emerges not from tactics, but from the absence of structured pathways that allow tactical knowledge to safely interact with expert systems.","marked":"The distinction between strategies and tactics reveals a critical blind spot: \u0001health systems are designed around strategies, while the majority of patient decision-making happens tactically.\u0002 Misinformation often emerges not from tactics, but from the absence of structured pathways that allow tactical knowledge to safely interact with expert systems.","excerpt":"health systems are designed around strategies, while the majority of patient decision-making happens tactically.","title":"Unlocking healthtech opportunities using Certeau's \"strategies\" and \"tactics\"","url":"https://stripepartners.substack.com/p/this-months-frame-unlocking-healthtech","author":"Stripe Partners","style":6},{"quote":"AI's pushiest evangelists are either full-time conference types, talking airily about how workers need to adapt in undefined ways for the Fourth Industrial Revolution, or earnest computer people who lionise their own small contributions to the rising tide of slop. Valuelessness comes in stereo. No wonder it's cathartic to tell both sides to bog off.","marked":"AI's pushiest evangelists are either full-time conference types, talking airily about how workers need to adapt in undefined ways for the Fourth Industrial Revolution, or earnest computer people who lionise their own small contributions to the rising tide of slop. \u0001Valuelessness comes in stereo.\u0002 No wonder it's cathartic to tell both sides to bog off.","excerpt":"Valuelessness comes in stereo.","title":"Now is a good time to shut up about AI","url":"https://substack.com/@ftav/p-188368455","author":"Alphaville","style":7},{"quote":"A system that is designed to fail safe, or fail-secure, or fail gracefully, whether it functions at a reduced level or fails completely, does so in a way that protects people, property, or data from injury, damage, intrusion, or disclosure.","marked":"A system that is designed to \u0001fail safe, or fail-secure, or fail gracefully\u0002, whether it functions at a reduced level or fails completely, does so in a way that protects people, property, or data from injury, damage, intrusion, or disclosure.","excerpt":"fail safe, or fail-secure, or fail gracefully","title":"Fault tolerance","url":"https://en.wikipedia.org/wiki/Fault_tolerance","author":"Contributors to Wikimedia projects","style":8},{"quote":"In intercom we set a goal for ourselves for the product design team. There's about 30 designers in this group and I asked all the product designers to ship a code change in Q2 to ship a pull request like ship code to production.","marked":"In intercom we set a goal for ourselves for the product design team. There's about 30 designers in this group and \u0001I asked all the product designers to ship a code change\u0002 in Q2 to ship a pull request like ship code to production.","excerpt":"I asked all the product designers to ship a code change","title":"When Designers Start Shipping Real Code","url":"https://www.youtube.com/watch?v=_acdhjOLvBs&t=1616s","author":"Emmet Connolly","style":9},{"quote":"Users bring their own creative goals to our product. They're incredibly diverse and often non-linear. I believe it's best to think of a use case as a test case to see if your basic tools are working.","marked":"Users bring their own creative goals to our product. They're incredibly diverse and often non-linear. \u0001I believe it's best to think of a use case as a test case to see if your basic tools are working.\u0002","excerpt":"I believe it's best to think of a use case as a test case to see if your basic tools are working.","title":"Overfitting and the problem with use cases","url":"https://medium.com/design-bootcamp/overfitting-and-the-problem-with-use-cases-337d9f4bf4d7","author":"Joe McLean","style":10},{"quote":"Claude Code and its ilk are coming for the study of politics like a freight train. A single academic is going to be able to write thousands of empirical papers per year. We'll need to find new ways of organizing and disseminating political science research in the very near future for this deluge.","marked":"\u0001Claude Code and its ilk are coming for the study of politics like a freight train.\u0002 A single academic is going to be able to write thousands of empirical papers per year. We'll need to find new ways of organizing and disseminating political science research in the very near future for this deluge.","excerpt":"Claude Code and its ilk are coming for the study of politics like a freight train.","title":"The Age of Academic Slop is Upon Us","url":"https://hegemon.substack.com/p/the-age-of-academic-slop-is-upon","author":"Seva Gunitsky","style":11},{"quote":"Designing for everyone means looking beyond surface categories like demographics or digital skill. A digital interface doesn't just require technical ability — it asks for time, trust, money for data, a quiet moment, a private connection, confidence, and even awareness that the service exists.","marked":"Designing for everyone means looking beyond surface categories like demographics or digital skill. \u0001A digital interface doesn't just require technical ability — it asks for time, trust, money for data, a quiet moment\u0002, a private connection, confidence, and even awareness that the service exists.","excerpt":"A digital interface doesn't just require technical ability — it asks for time, trust, money for data, a quiet moment","title":"Universal Barriers to Access","url":"https://uteschauberger.com/barrierstoaccess.html","author":"Ute Schauberger","style":0},{"quote":"Wplace is a collaborative, real-time pixel canvas layered over the world map, where anyone can paint and create art together.","marked":"Wplace is a collaborative, real-time pixel canvas layered over the world map, where \u0001anyone can paint and create art together.\u0002","excerpt":"anyone can paint and create art together.","title":"Paint the world","url":"https://wplace.live/","author":"Murilo Matsubara","style":1},{"quote":"What if AI became the connective tissue of a team, something that lives in the gaps between people. That carries memory across time: the decisions made, the reasoning behind them, the things tried and abandoned.","marked":"\u0001What if AI became the connective tissue of a team\u0002, something that lives in the gaps between people. That carries memory across time: the decisions made, the reasoning behind them, the things tried and abandoned.","excerpt":"What if AI became the connective tissue of a team","title":"Design in the (AI) loop","url":"https://www.katherinewastell.com/blog/2026/3/2/design-in-the-ai-loop","author":"Katherine Wastell","style":2}],"styles":[{"font":"'Bodoni Moda', serif","bg":"#6B1E1E","ink":"#F3E9D7","italic":false},{"font":"'EB Garamond', serif","bg":"#F2EBDD","ink":"#1C1A17","italic":true},{"font":"'Libre Caslon Text', serif","bg":"#1F3A2E","ink":"#ECE4CF","italic":false},{"font":"'Playfair Display', serif","bg":"#D9A441","ink":"#2A1E0E","italic":false},{"font":"'Cormorant Garamond', serif","bg":"#18233A","ink":"#F1E6D2","italic":true},{"font":"'Bodoni Moda', serif","bg":"#EED6CF","ink":"#5A1F2B","italic":true},{"font":"'Playfair Display', serif","bg":"#1E3FAE","ink":"#F5F0E6","italic":true},{"font":"'DM Serif Display', serif","bg":"#151413","ink":"#EDE6D6","italic":false},{"font":"'Libre Caslon Text', serif","bg":"#B9C3A5","ink":"#1F2A1C","italic":true},{"font":"'EB Garamond', serif","bg":"#C8432B","ink":"#FBF3E6","italic":false},{"font":"'DM Serif Display', serif","bg":"#E4DCCB","ink":"#23314F","italic":true},{"font":"'Cormorant Garamond', serif","bg":"#3B2A22","ink":"#E9D9BF","italic":false}]};

    function sizeFor(text) {
      const n = text.length;
      if (n <= 110) return 8.4;
      if (n <= 200) return 6.6;
      if (n <= 280) return 5.8;
      if (n <= 380) return 5.0;
      if (n <= 480) return 4.4;
      return 3.9;
    }

    function esc(s) {
      return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    // The full quote, as paragraphs, with the poster's excerpt marked.
    function fullHTML(p) {
      return esc(p.marked).split(/\n+/).map(t => '<p>' + t.trim() + '</p>').join('')
        .replace(/([^]*?)/g, (m, x) => '<mark>' + x.split('</p><p>').join('</mark></p><p><mark>') + '</mark>');
    }

    function posterHTML(p, i, tag, full) {
      const s = styles[p.style];
      const text = full ? p.quote : p.excerpt;
      const paras = full ? fullHTML(p) : p.excerpt.split(/\n+/).map(t => '<p>' + esc(t.trim()) + '</p>').join('');
      const vars = '--bg:' + s.bg + ';--ink:' + s.ink + ';--font:' + s.font +
        ';--style:' + (s.italic ? 'italic' : 'normal') + ';--size:' + sizeFor(text);
      const attrs = tag === 'a' ? ' href="#' + (i + 1) + '" aria-label="Poster ' + (i + 1) + ': ' + esc(p.title) + '"' : '';
      return '<' + tag + ' class="poster" style="' + vars + '"' + attrs + '>' +
        '<div class="poster-inner"><div class="quote' + (full ? ' full' : '') + (text.length < 160 ? ' short' : '') + '">' + paras + '</div></div>' +
        '<div class="meta"><a href="' + esc(p.url) + '">' + esc(p.title) + '</a>' +
        (p.author ? '<br><span class="author">' + esc(p.author) + '</span>' : '') + '</div>' +
        '</' + tag + '>';
    }

    document.getElementById('wall').innerHTML = posters.map((p, i) => posterHTML(p, i, 'a')).join('');

    const single = document.getElementById('single');
    let current = -1;
    let full = false;

    function show(i) {
      single.classList.toggle('fresh', i !== current);
      if (i !== current) full = false;
      current = (i + posters.length) % posters.length;
      const p = posters[current];
      const s = styles[p.style];
      single.innerHTML = posterHTML(p, current, 'div', full) +
        '<div class="controls" style="--ink:' + s.ink + '">' +
          (p.excerpt !== p.quote ? '<button type="button" data-full>' + (full ? 'Excerpt' : 'Full quote') + '</button>' : '') +
          '<span class="count">' + (current + 1) + ' of ' + posters.length + '</span>' +
          '<button type="button" data-go="-1">Previous</button>' +
          '<button type="button" data-go="1">Next</button>' +
          '<a href="#">View all</a>' +
        '</div>';
      document.body.classList.add('is-single');
      document.title = posters[current].title + ' – link quote posters';
      document.querySelector('meta[name=theme-color]')?.setAttribute('content', s.bg);
    }

    function go(step) { location.hash = '#' + (((current + step + posters.length) % posters.length) + 1); }

    function route() {
      const n = parseInt(location.hash.slice(1), 10);
      if (n >= 1 && n <= posters.length) {
        show(n - 1);
      } else {
        const was = current;
        current = -1;
        document.body.classList.remove('is-single');
        document.title = 'link quote posters';
        if (was >= 0) document.querySelectorAll('.wall .poster')[was]?.focus({ preventScroll: false });
      }
    }

    single.addEventListener('click', e => {
      if (e.target.closest('[data-full]')) { full = !full; return show(current); }
      const btn = e.target.closest('[data-go]');
      if (btn) return go(+btn.dataset.go);
      if (e.target.closest('a, .controls')) return;
      // Click the left third to go back, anywhere else to go forward.
      go(e.clientX < window.innerWidth / 3 ? -1 : 1);
    });

    document.addEventListener('keydown', e => {
      if (current < 0) return;
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
      if (e.key === 'ArrowLeft') go(-1);
      if (e.key === 'Escape') location.hash = '';
    });

    let touchX = null;
    single.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
    single.addEventListener('touchend', e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
    });

    window.addEventListener('hashchange', route);
    route();
  </script>
</body>
